<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us — After Dark Society</title>
  <meta name="description" content="Get in touch with After Dark Society.">
  <meta name="theme-color" content="#060508">
  <meta property="og:title" content="Contact Us — After Dark Society">
  <meta property="og:description" content="Get in touch with After Dark Society.">
  <meta property="og:image" content="https://afterdarksociety.social/assets/img/share.jpg">
  <meta property="og:url" content="https://afterdarksociety.social/contact.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="After Dark Society">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://afterdarksociety.social/contact.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<section class="page-hero">
  <div class="wrap">
    <span class="eyebrow reveal">Contact us</span>
    <h1 class="display h1 reveal" data-delay="1">Say <span class="script">hello</span></h1>
    <p class="lead reveal" data-delay="2">Questions, feedback or anything else — drop us a line. For tables use <a href="book.html" style="color:var(--gold-hi)">Book your table</a>; for collaborations, <a href="pr.html" style="color:var(--gold-hi)">Talk to PR</a>.</p>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="tiles" id="contact-tiles"></div>
    <div class="form reveal" style="max-width:820px;margin-inline:auto">
      <form data-form="Contact" novalidate>
        <div class="form-body">
          <div class="form-grid">
            <div class="field"><label for="k-name">Name <span class="req">*</span></label><input id="k-name" name="name" autocomplete="name" required></div>
            <div class="field"><label for="k-email">Email <span class="req">*</span></label><input id="k-email" name="email" type="email" autocomplete="email" required></div>
            <div class="field full"><label for="k-phone">Phone</label><input id="k-phone" name="phone" type="tel" autocomplete="tel"></div>
            <div class="field full"><label for="k-msg">Message <span class="req">*</span></label><textarea id="k-msg" name="message" required></textarea></div>
          </div>
          <div class="form-foot">
            <small>We reply within one working day.</small>
            <button class="btn" type="submit">Send message</button>
          </div>
        </div>
        <div class="form-success">
          <span class="script">Thank you</span>
          <h2 class="display h3">Message received.</h2>
          <p class="lead" style="margin:14px auto 0">We'll get back to you soon.</p>
        </div>
      </form>
    </div>
  </div>
</section>
</main>
<footer id="site-footer"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
