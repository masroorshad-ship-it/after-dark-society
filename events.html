<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upcoming Events — After Dark Society</title>
  <meta name="description" content="Upcoming After Dark Society, Bolly Room and Sound Society nights. Reserve your table before it&#x27;s gone.">
  <meta name="theme-color" content="#060508">
  <meta property="og:title" content="Upcoming Events — After Dark Society">
  <meta property="og:description" content="Upcoming After Dark Society, Bolly Room and Sound Society nights. Reserve your table before it&#x27;s gone.">
  <meta property="og:image" content="assets/img/after-dark-society.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<section class="page-hero has-bg" style="background-image: linear-gradient(180deg, rgba(6,5,8,.55), rgba(6,5,8,.82) 70%, #060508), url('assets/gallery/front-row.jpg')">
  <div class="wrap">
    <span class="eyebrow reveal">Upcoming events</span>
    <h1 class="display h1 reveal" data-delay="1">Save the <span class="script">night</span></h1>
    <p class="lead reveal" data-delay="2">Every date, every venue. Tables go fast — reserve early, or follow us on Instagram for drops.</p>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="section-head"><div class="reveal"><span class="eyebrow">Coming up</span><h2 class="display h2">Next nights</h2></div></div>
    <ul class="event-list" id="upcoming-list"></ul>
  </div>
</section>

<section class="section" style="background:var(--ink-2);border-top:1px solid var(--line)">
  <div class="wrap">
    <div class="section-head"><div class="reveal"><span class="eyebrow">Previously</span><h2 class="display h2">Past nights</h2></div></div>
    <ul class="event-list" id="past-list"></ul>
  </div>
</section>

<section class="cta-band">
  <div class="wrap reveal">
    <span class="eyebrow">Don't miss the next one</span>
    <h2 class="display h2">Lock in your <span class="script">table</span></h2>
    <a class="btn" href="book.html">Book your table</a>
  </div>
</section>
</main>
<footer id="site-footer"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
